<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи</title>
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задачи">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="two">
<div class="app">
<h2 class="sr-only">В строке проекта показан следующий шаг, тап по кольцу закрывает именно его; шаг также можно отметить в чате проекта</h2>
<div class="grid">

  <div class="scr on" id="scr-list"><div class="pnl">
    <div class="hd hd-list">
      <span class="ttl">Входящие</span>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="bd" id="list" style="display:flex; flex-direction:column;"></div>
    <div class="ft">
      <div class="ftr">
        <input type="text" id="nt" placeholder="Новая задача" aria-label="Новая задача" />
        <button id="add" class="ib" aria-label="Добавить задачу"></button>
      </div>
      <div id="err" class="err" role="alert">Введите текст задачи</div>
    </div>
  </div></div>

  <div class="scr" id="scr-detail"><div class="pnl">
    <div class="hd">
      <div class="hd-row">
        <div class="cel">
          <div id="crumb" class="crumb"></div>
          <input id="ct" class="ct" aria-label="Название" />
          <div id="cm" class="cm"></div>
        </div>
        <span id="hctl" class="ck"></span>
      </div>
      <div id="acts" class="acts"></div>
    </div>
    <div class="bd thread" id="thread"></div>
    <div class="ft">
      <div class="ftr">
        <input type="text" id="msg" placeholder="Спросить Claude" aria-label="Сообщение" />
        <button id="send" class="ib" aria-label="Отправить"></button>
      </div>
    </div>
  </div></div>
</div>
</div>
<script>window.MODE='two'</script>
<script src="app.js"></script>
</body>
</html>
