    <!-- column-reverse: первый в разметке — внизу. Список идёт первым, над ним колпак под шапку -->
    <div class="scroll" id="scroll">
      <div id="list"></div>
      <div class="cap"></div>
    </div>
    <div class="dock" id="dock">
      <!-- три капсулы: чем показан список. Ряд ровно 44 высотой — на этой геометрии стоит
           свёрнутая капсула строки ввода (translateY(-75px) = 26 + 44 + 21 − 16) -->
      <div class="dockrow" role="tablist" aria-label="Что показывать">
        <span class="segbar" aria-hidden="true"></span>
        <button class="seg press" type="button" role="tab" data-tab="flow">FLOW</button>
        <button class="seg press" type="button" role="tab" data-tab="process">PROCESS</button>
        <button class="seg press" type="button" role="tab" data-tab="focus">FOCUS</button>
      </div>
    </div>
    <!-- Кнопка и строка ввода — одна капсула: в свёрнутом виде это красный круг с пауком на месте
         большой кнопки, при нажатии он сам вытягивается в строку ввода и обратно -->
    <div class="composer mini" id="composer">
      <button class="shutter press" id="shutter" aria-label="Новая задача"></button>
      <button class="rnd press" id="clip" aria-label="Вложение"></button>
      <input class="inp" type="text" id="nt" placeholder="Новая задача" aria-label="Новая задача"
             autocomplete="off" autocorrect="off" autocapitalize="sentences" enterkeyhint="done">
      <button class="rnd solid press" id="add" aria-label="Добавить задачу"></button>
    </div>
    <div class="pend" id="pend" hidden aria-live="polite"></div>
    <div class="toast" id="toast"><span id="toast-t"></span><button class="undo press" id="undo">Вернуть</button></div>
  </section>

  <section class="screen" id="scr-detail">
    <div class="veil top" aria-hidden="true"></div>
    <button class="rnd44 topbtn left press" id="back" aria-label="Назад к списку"></button>
    <button class="rnd44 topbtn press" id="hctl" aria-label="Выполнить"></button>
    <div class="title"><span id="crumb" class="sr-only"></span><input id="ct" class="h1" aria-label="Название"><span class="meta" id="cm" hidden></span></div>
    <div class="scroll thread" id="thread"></div>
    <div class="pend" id="pend2" hidden aria-live="polite"></div>
    <div class="composer" id="composer2">
      <button class="rnd press" id="clip2" aria-label="Вложение"></button>
      <input class="inp" type="text" id="msg" placeholder="Спросить" aria-label="Сообщение"
             autocomplete="off" enterkeyhint="send">
      <button class="rnd solid press" id="send" aria-label="Отправить"></button>
    </div>
  </section>
